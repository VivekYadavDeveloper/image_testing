name: image_task
description: "A new Flutter project."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Firebase (Firestore)
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12

  # Image pick / camera
  image_picker: ^1.1.2

  # Cloudinary upload (REST)
  http: ^1.5.0

  # UI
  dotted_border: ^2.1.0
  google_fonts: ^6.3.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true